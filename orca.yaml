# orca.yaml — Orca worktree bootstrap (policy A). Guarded; clean no-op without the tools.
# ccdoc project is "yopa-page"; cxdoc project is "yopa.page".
# Set Orca Command Source = "orca.yaml only" (or Run both) so these run.
scripts:
  setup: |
    export CCDOC_HOME="/Users/yoonsoo.park/code/ncino/claude-code-hub"
    # Orca copies the parent checkout's gitignored .claude into a new worktree, so the
    # worktree starts in the legacy install form and `harness apply` alone refuses it.
    # Convert first, then apply. On an already converted checkout repair exits 0 with
    # "nothing to convert", so this is safe to run every time. Neither may fail the
    # worktree, hence `|| true`.
    if command -v ccdoc >/dev/null 2>&1; then
      ccdoc harness repair --cwd "$ORCA_WORKTREE_PATH" --apply --json || true
      ccdoc harness apply --cwd "$ORCA_WORKTREE_PATH" --json || true
    fi
    command -v cxdoc >/dev/null 2>&1 && cxdoc checkout add yopa.page "$ORCA_WORKTREE_PATH" || true
  archive: |
    # No ccdoc sync here: a worktree holds the repo's tracked CLAUDE.md, not the hub
    # symlink, so syncing back overwrote the hub copy (2026-08-11).
    export CCDOC_HOME="/Users/yoonsoo.park/code/ncino/claude-code-hub"
    command -v cxdoc >/dev/null 2>&1 && cxdoc checkout remove yopa.page "$ORCA_WORKTREE_PATH" || true
